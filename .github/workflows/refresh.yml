name: Refresh official source snapshot
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scraper.py
      - run: python validate.py
      - name: Commit source changes
        run: |
          git config user.name "HostDealRadar source checker"
          git config user.email "41898282+kete10553-stack4@users.noreply.github.com"
          git add data/offers.json site
          git diff --cached --quiet || git commit -m "Refresh official source snapshot"
          git push
