<svg xmlns="http://www.w3.org/2000/svg" width="720" height="670" viewBox="0 0 720 670" role="img" aria-labelledby="title desc"><title id="title">Before you transfer a domain</title><desc id="desc">Compare costs, confirm transfer eligibility, and preserve DNS and mail before the move.</desc><rect width="720" height="670" rx="24" fill="#f0f6f5"/><g font-family="Arial, sans-serif" fill="#173a38"><text x="36" y="62" font-size="32" font-weight="700">Lower the bill. Keep the services.</text><rect x="28" y="100" width="664" height="156" rx="14" fill="#fff"/><text x="48" y="145" font-size="30" font-weight="700">1  Compare two different prices</text><text x="48" y="190" font-size="26">What do you pay to transfer now?</text><text x="48" y="228" font-size="26">What will the next renewal cost?</text><rect x="28" y="274" width="664" height="156" rx="14" fill="#fff"/><text x="48" y="319" font-size="30" font-weight="700">2  Check eligibility and timing</text><text x="48" y="364" font-size="26">Check locks, expiry and approval access.</text><text x="48" y="402" font-size="26">Do not plan around a last-day transfer.</text><rect x="28" y="448" width="664" height="156" rx="14" fill="#fff"/><text x="48" y="493" font-size="30" font-weight="700">3  Preserve DNS and email</text><text x="48" y="538" font-size="26">Confirm the DNS service will continue.</text><text x="48" y="576" font-size="26">Moving a domain does not move mailboxes.</text><text x="36" y="644" font-size="21">HostDealRadar · Source review: October 1, 2026</text></g></svg>
